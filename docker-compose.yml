# docker-compose.yml
version: '3.8'

services:
  # ========================================================
  # Database: PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: campusx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusx_password}
      POSTGRES_DB: ${POSTGRES_DB:-campusx_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusx_user} -d ${POSTGRES_DB:-campusx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - campusx-network

  # ========================================================
  # Backend Server: Node.js + Express (Modular Monolith)
  # ========================================================
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: campusx-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusx_user}:${POSTGRES_PASSWORD:-campusx_password}@postgres:5432/${POSTGRES_DB:-campusx_db}?schema=public
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      BODY_LIMIT: 10mb
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusx-network

  # ========================================================
  # Frontend Client: Vite + React + Tailwind
  # ========================================================
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: campusx-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_AI_SERVICE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusx-network

  # ========================================================
  # AI Microservice: Python FastAPI
  # ========================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/Dockerfile.ai-service
    container_name: campusx-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENV: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:5000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusx-network

volumes:
  postgres_data:
    driver: local

networks:
  campusx-network:
    driver: bridge
