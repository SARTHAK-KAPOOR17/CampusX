# docker-compose.yml
services:
  # ========================================================
  # Database: PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: campusx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusx_password}
      POSTGRES_DB: ${POSTGRES_DB:-campusx_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusx_user} -d ${POSTGRES_DB:-campusx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - campusx-network

  # ========================================================
  # Object Storage: MinIO (S3-Compatible)
  # ========================================================
  minio:
    image: pgsty/minio:latest
    container_name: campusx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campusx_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campusx_minio_secret_2026}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusx-network

  # ========================================================
  # Cache & Rate Limit Store: Redis
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: campusx-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-campusx_redis_secret_2026}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-campusx_redis_secret_2026} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - campusx-network

  # ========================================================
  # Backend Server: Node.js + Express (Modular Monolith)
  # ========================================================
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: campusx-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusx_user}:${POSTGRES_PASSWORD:-campusx_password}@postgres:5432/${POSTGRES_DB:-campusx_db}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      BODY_LIMIT: ${BODY_LIMIT:-10mb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-campusx-dev-access-secret-key-change-in-production-2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_NAME: ${ADMIN_NAME:-CampusX Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campusx.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@CampusX2026!}
      ALLOWED_COLLEGE_DOMAINS: ${ALLOWED_COLLEGE_DOMAINS:-chitkara.edu.in}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-CampusX <noreply@campusx.edu>}
      LISTING_EXPIRY_DAYS: ${LISTING_EXPIRY_DAYS:-60}
      ENABLE_CRON: ${ENABLE_CRON:-true}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-campusx-media}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-campusx_minio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-campusx_minio_secret_2026}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      SIGNED_URL_EXPIRY_SECONDS: ${SIGNED_URL_EXPIRY_SECONDS:-900}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-campusx_redis_secret_2026}
      REDIS_URL: redis://:${REDIS_PASSWORD:-campusx_redis_secret_2026}@redis:6379
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-60}
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS:-60}
      CATEGORIES_CACHE_TTL_SECONDS: ${CATEGORIES_CACHE_TTL_SECONDS:-3600}
      POPULAR_CACHE_TTL_SECONDS: ${POPULAR_CACHE_TTL_SECONDS:-300}
      SUGGEST_CACHE_TTL_SECONDS: ${SUGGEST_CACHE_TTL_SECONDS:-60}
      PRODUCT_DETAIL_CACHE_TTL_SECONDS: ${PRODUCT_DETAIL_CACHE_TTL_SECONDS:-30}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - campusx-network

  # ========================================================
  # Frontend Client: Vite + React + Tailwind
  # ========================================================
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: campusx-client
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusx-network

  # ========================================================
  # AI Microservice: Python FastAPI
  # ========================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/Dockerfile.ai-service
    container_name: campusx-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENV: ${AI_SERVICE_ENV:-development}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:5000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusx-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  campusx-network:
    driver: bridge
