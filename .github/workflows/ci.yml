name: CampusX CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ========================================================
  # Server CI: Install, Lint, Build & Jest Unit Tests
  # ========================================================
  server-ci:
    name: Server (Node.js + Express + Prisma)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Run Server Lint Check
        run: |
          cd server
          npm run lint

      - name: Generate Prisma Client & Build
        run: |
          cd server
          npm run build

      - name: Run Server Unit & Health Integration Tests
        run: |
          cd server
          npm test

  # ========================================================
  # Client CI: Install, Lint & Production Build
  # ========================================================
  client-ci:
    name: Client (React + Vite + Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Run Client Lint Check
        run: |
          cd client
          npm run lint

      - name: Build Vite React Production Bundle
        run: |
          cd client
          npm run build

  # ========================================================
  # AI Service CI: Python Install & Module Import Verification
  # ========================================================
  ai-service-ci:
    name: AI Service (Python FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd ai-service
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify AI Service Module Imports & Config
        run: |
          cd ai-service
          python -c "import app.main; print('Successfully validated CampusX AI Service import integrity')"
