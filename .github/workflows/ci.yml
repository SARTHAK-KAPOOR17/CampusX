name: CampusX CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ========================================================
  # Server CI: Install, Lint, Build, Migrate & Jest Tests
  # ========================================================
  server-ci:
    name: Server (Node.js + Express + Prisma)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusx_user
          POSTGRES_PASSWORD: campusx_password
          POSTGRES_DB: campusx_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campusx_user:campusx_password@localhost:5432/campusx_db?schema=public
      JWT_ACCESS_SECRET: campusx-ci-test-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: 7
      BCRYPT_ROUNDS: 12
      ADMIN_NAME: CampusX Admin
      ADMIN_EMAIL: admin@campusx.edu
      ADMIN_PASSWORD: Admin@CampusX2026!
      ALLOWED_COLLEGE_DOMAINS: campusx.edu,university.edu,mit.edu,stanford.edu,iitd.ac.in
      OTP_EXPIRY_MINUTES: 10
      SMTP_HOST: ''
      SMTP_PORT: 587
      SMTP_USER: ''
      SMTP_PASS: ''
      EMAIL_FROM: CampusX <noreply@campusx.edu>

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Server Lint Check
        run: |
          cd server
          npm run lint

      - name: Generate Prisma Client & Build
        run: |
          cd server
          npm run build

      - name: Apply Prisma Migrations
        run: |
          cd server
          npx prisma migrate deploy

      - name: Run Server Unit & Integration Tests
        run: |
          cd server
          npm test

  # ========================================================
  # Client CI: Install, Lint & Production Build
  # ========================================================
  client-ci:
    name: Client (React + Vite + Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Lint Check
        run: |
          cd client
          npm run lint

      - name: Build Vite React Production Bundle
        run: |
          cd client
          npm run build

  # ========================================================
  # AI Service CI: Python Install & Module Import Verification
  # ========================================================
  ai-service-ci:
    name: AI Service (Python FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd ai-service
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify AI Service Module Imports & Config
        run: |
          cd ai-service
          python -c "import app.main; print('Successfully validated CampusX AI Service import integrity')"
